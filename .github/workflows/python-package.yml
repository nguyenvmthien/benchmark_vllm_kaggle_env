name: InferCap CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    env:
      MPLBACKEND: Agg

    steps:
      - uses: actions/checkout@v4
      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.13"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install locked test dependencies
        # Unit tests mock runtime/GPU checks; omit vLLM, Triton and their
        # transitive dependencies to keep this job suitable for CPU runners.
        run: |
          uv export --locked --no-dev --no-emit-project --prune vllm --prune triton --output-file "$RUNNER_TEMP/requirements-test.txt"
          uv venv
          uv pip sync "$RUNNER_TEMP/requirements-test.txt"
          uv pip install --no-deps -e .
      - name: Lint with flake8
        run: |
          uvx flake8 src scripts tests --count --select=E9,F63,F7,F82 --show-source --statistics
          uvx flake8 src scripts tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      - name: Check Python syntax
        run: uv run --no-sync python -m compileall -q src scripts tests
      - name: Verify CLI entry points
        run: |
          uv run --no-sync python -m infercap --help
          uv run --no-sync infercap --help
          uv run --no-sync infercap check --help
          uv run --no-sync infercap benchmark --help
      - name: Run unit tests
        # Do not sync here: a full sync would reinstall the GPU runtime stack.
        run: uv run --no-sync python -m unittest discover -s tests -v
