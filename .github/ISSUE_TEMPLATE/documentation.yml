name: Documentation
description: Report missing, unclear, or incorrect documentation
title: "[Docs]: "
labels: [documentation]
body:
  - type: input
    id: location
    attributes:
      label: Documentation location
      description: Link or name the file and section.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing, unclear, or incorrect?
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Suggested change
      description: What should the documentation say or show instead?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add examples, screenshots, or related links if useful.
