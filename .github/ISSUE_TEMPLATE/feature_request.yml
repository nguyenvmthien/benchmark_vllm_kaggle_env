name: Feature request
description: Propose an improvement to InferCap
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or maintainer problem should this address?
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why is this problem important, and who benefits?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed scope
      description: Describe the desired outcome and identify affected hardware or runtime, if any.
      placeholder: NVIDIA GPU and vLLM
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe workarounds or other approaches you evaluated.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List the observable conditions that would make this request complete.
      placeholder: |
        - [ ] ...
    validations:
      required: true
  - type: checkboxes
    id: architecture
    attributes:
      label: Architecture discussion
      options:
        - label: I understand significant features and architecture changes should be discussed before implementation.
          required: true
