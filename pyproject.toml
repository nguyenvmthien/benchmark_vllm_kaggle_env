[project]
name = "infercap"
version = "0.2.1"
description = "Hardware-aware inference capacity, compatibility, serving, and benchmarking toolkit"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Thien Nguyen" }]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Benchmark",
]
dependencies = [
    "aiohttp>=3.9",
    "matplotlib>=3.8",
    "triton>=3.7.1",
    "vllm>=0.28.0",
    "wrapt>=2.4.0",
]

[project.scripts]
infercap = "infercap.cli:main"

[project.urls]
Homepage = "https://github.com/nguyenvmthien/infercap"
Repository = "https://github.com/nguyenvmthien/infercap"
Documentation = "https://github.com/nguyenvmthien/infercap/tree/master/docs"
Issues = "https://github.com/nguyenvmthien/infercap/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/infercap"]
