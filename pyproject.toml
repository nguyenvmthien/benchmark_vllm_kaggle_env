[project]
name = "infercap"
version = "0.2.0"
description = "Hardware-aware inference capacity, compatibility, serving, and benchmarking toolkit"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9",
    "matplotlib>=3.8",
    "triton>=3.7.1",
    "vllm>=0.28.0",
    "wrapt>=2.4.0",
]

[project.scripts]
benchmark-vllm = "src.benchmark.main:main"
benchmark-vllm-check = "src.scripts.check_runable:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
