[project]
name = "infercap"
version = "0.2.0"
description = "Hardware-aware inference capacity, compatibility, serving, and benchmarking toolkit"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9",
    "matplotlib>=3.8",
    "triton>=3.7.1",
    "vllm>=0.28.0",
    "wrapt>=2.4.0",
]

[project.scripts]
infercap = "infercap.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/infercap"]